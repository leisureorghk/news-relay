name: Refresh news relay

on:
  schedule:
    # 每 4 小時（UTC 0/4/8/12/16/20＝香港 8/12/16/20/0/4）；免費 runner 可能延遲
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-relay-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and filter feeds
        run: node src/refresh.mjs

      - name: Commit feed.json / status.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/status.json
          if git diff --staged --quiet; then
            echo "feed/status unchanged"
            exit 0
          fi
          git commit -m "chore: refresh relay feed ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
